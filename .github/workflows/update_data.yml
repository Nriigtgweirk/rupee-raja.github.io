name: Daily Momentum Calculation

on:
  schedule:
    - cron: '0 12 * * 1-5' # Runs at 12:00 UTC (5:30 PM IST) on weekdays
  workflow_dispatch: # Allows manual trigger anytime from GitHub tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: Run Momentum Script
        run: python compute_momentum.py

      - name: Commit and Push Updated data.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "Auto-update momentum data" || exit 0
          git push
